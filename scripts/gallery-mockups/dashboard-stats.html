<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-100">
    <div id="shot" class="inline-block p-10">
      <div class="grid w-[560px] grid-cols-2 gap-4">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-500">Total revenue</span>
            <span class="rounded-md bg-green-100 px-2 py-0.5 text-xs font-semibold text-green-700">+12.5%</span>
          </div>
          <p class="mt-3 text-3xl font-bold text-slate-900">$48,290</p>
          <p class="mt-1 text-xs text-slate-400">vs. $42,910 last month</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-500">Active users</span>
            <span class="rounded-md bg-green-100 px-2 py-0.5 text-xs font-semibold text-green-700">+4.2%</span>
          </div>
          <p class="mt-3 text-3xl font-bold text-slate-900">2,318</p>
          <p class="mt-1 text-xs text-slate-400">vs. 2,224 last month</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-500">Conversion</span>
            <span class="rounded-md bg-red-100 px-2 py-0.5 text-xs font-semibold text-red-700">-1.1%</span>
          </div>
          <p class="mt-3 text-3xl font-bold text-slate-900">3.24%</p>
          <p class="mt-1 text-xs text-slate-400">vs. 3.28% last month</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-500">Avg. session</span>
            <span class="rounded-md bg-green-100 px-2 py-0.5 text-xs font-semibold text-green-700">+8.0%</span>
          </div>
          <p class="mt-3 text-3xl font-bold text-slate-900">4m 12s</p>
          <p class="mt-1 text-xs text-slate-400">vs. 3m 53s last month</p>
        </div>
      </div>
    </div>
  </body>
</html>
