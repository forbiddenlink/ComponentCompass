<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-100">
    <div id="shot" class="inline-block p-10">
      <div class="w-96 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
        <p class="mt-1 text-sm text-slate-500">Sign in to your account to continue.</p>
        <div class="mt-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input type="email" value="you@example.com" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700" />
          </div>
          <div>
            <div class="flex items-center justify-between">
              <label class="block text-sm font-medium text-slate-700">Password</label>
              <a class="text-xs font-medium text-indigo-600">Forgot?</a>
            </div>
            <input type="password" value="password123" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700" />
          </div>
          <label class="flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" checked class="rounded border-slate-300" /> Remember me
          </label>
          <button class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Sign in</button>
          <button class="w-full rounded-lg border border-slate-300 bg-white py-2.5 text-sm font-semibold text-slate-700">Continue with Google</button>
        </div>
        <p class="mt-6 text-center text-sm text-slate-500">No account? <a class="font-medium text-indigo-600">Sign up</a></p>
      </div>
    </div>
  </body>
</html>
